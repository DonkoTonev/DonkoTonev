<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d1a2b"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .t   { font: 600 15px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1.5px; }
    .big { font: 800 64px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: url(#g); }
    .bl  { font: 600 16px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .sv  { font: 800 28px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; }
    .sl  { font: 400 13px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .lg  { font: 500 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .lv  { font: 700 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; }
    .ml  { font: 500 11px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #64748b; }
    .dc  { font: 800 26px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; }
    .ds  { font: 500 11px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1px; }
    .arc { stroke-linecap: round; opacity: 0; animation: fade .8s ease-out forwards; }
    .a1 { animation-delay: .25s } .a2 { animation-delay: .5s }
    @keyframes fade { to { opacity: 1; } }
    .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="url(#bg)" stroke="#1e293b"/>
  <circle cx="600" cy="150" r="120" fill="url(#glow)"/>

  <text x="44" y="56" class="t">ACTIVITY · LAST 12 MONTHS</text>
  <text x="42" y="132" class="big">1,361</text>
  <text x="44" y="160" class="bl">contributions — mostly private work</text>
  <line x1="44" y1="190" x2="400" y2="190" stroke="#1e293b"/>
  <text x="44" y="234" class="sv">246</text><text x="44" y="256" class="sl">active days</text>
  <text x="170" y="234" class="sv">20</text><text x="170" y="256" class="sl">day best streak</text>
  <text x="290" y="234" class="sv">2+ yrs</text><text x="290" y="256" class="sl">in production at EDITED</text>

  <circle cx="600" cy="150" r="62" fill="none" stroke="#1e293b" stroke-width="18"/>
  <circle cx="600" cy="150" r="62" fill="none" stroke="#22d3ee" stroke-width="18" stroke-dasharray="254.1 389.6" stroke-dashoffset="0.0" transform="rotate(-90 600 150)" class="arc a0"/><circle cx="600" cy="150" r="62" fill="none" stroke="#2dd4bf" stroke-width="18" stroke-dasharray="82.7 389.6" stroke-dashoffset="-257.1" transform="rotate(-90 600 150)" class="arc a1"/><circle cx="600" cy="150" r="62" fill="none" stroke="#a78bfa" stroke-width="18" stroke-dasharray="43.7 389.6" stroke-dashoffset="-342.8" transform="rotate(-90 600 150)" class="arc a2"/>
  <text x="600" y="156" class="dc" text-anchor="middle">66%</text>
  <text x="600" y="174" class="ds" text-anchor="middle">COMMITS</text>
  <g transform="translate(700 108)"><rect width="10" height="10" rx="3" y="-9" fill="#22d3ee"/><text x="18" class="lg">Commits</text><text x="150" class="lv" text-anchor="end">66%</text></g><g transform="translate(700 142)"><rect width="10" height="10" rx="3" y="-9" fill="#2dd4bf"/><text x="18" class="lg">Pull requests</text><text x="150" class="lv" text-anchor="end">22%</text></g><g transform="translate(700 176)"><rect width="10" height="10" rx="3" y="-9" fill="#a78bfa"/><text x="18" class="lg">Code review</text><text x="150" class="lv" text-anchor="end">12%</text></g>

  <text x="880" y="56" class="t">ACTIVE DAYS / MONTH</text>
  <line x1="880" y1="232" x2="1173" y2="232" stroke="#1e293b"/>
  <rect x="880" y="207.8" width="18" height="24.2" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.00s"/><rect x="905" y="159.4" width="18" height="72.6" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.06s"/><rect x="930" y="120.7" width="18" height="111.3" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.12s"/><rect x="955" y="115.9" width="18" height="116.1" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.18s"/><rect x="980" y="125.5" width="18" height="106.5" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.24s"/><rect x="1005" y="149.7" width="18" height="82.3" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.30s"/><rect x="1030" y="106.2" width="18" height="125.8" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.36s"/><rect x="1055" y="111.0" width="18" height="121.0" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.42s"/><rect x="1080" y="106.2" width="18" height="125.8" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.48s"/><rect x="1105" y="140.1" width="18" height="91.9" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.54s"/><rect x="1130" y="125.5" width="18" height="106.5" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.60s"/><rect x="1155" y="169.1" width="18" height="62.9" rx="5" fill="url(#bar)" class="bar" style="animation-delay:0.66s"/>
  <text x="889" y="250" class="ml" text-anchor="middle">D</text><text x="914" y="250" class="ml" text-anchor="middle">J</text><text x="939" y="250" class="ml" text-anchor="middle">F</text><text x="964" y="250" class="ml" text-anchor="middle">M</text><text x="989" y="250" class="ml" text-anchor="middle">A</text><text x="1014" y="250" class="ml" text-anchor="middle">M</text><text x="1039" y="250" class="ml" text-anchor="middle">J</text><text x="1064" y="250" class="ml" text-anchor="middle">J</text><text x="1089" y="250" class="ml" text-anchor="middle">A</text><text x="1114" y="250" class="ml" text-anchor="middle">S</text><text x="1139" y="250" class="ml" text-anchor="middle">O</text><text x="1164" y="250" class="ml" text-anchor="middle">N</text>
