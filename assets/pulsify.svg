<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141a"/><stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 800 40px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; }
    .tag   { font: 600 18px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: url(#t); }
    .txt   { font: 400 16px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .chip  { font: 600 13px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #99f6e4; }
    .beat { stroke-dasharray: 400; stroke-dashoffset: 400; animation: d 2.4s ease-in-out infinite; }
    @keyframes d { 0% { stroke-dashoffset: 400 } 55% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -400 } }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 140px 130px; }
    @keyframes r { 0% { transform: scale(.85); opacity: .7 } 100% { transform: scale(1.25); opacity: 0 } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#134e4a"/>

  <!-- app icon -->
  <circle class="ring" cx="140" cy="130" r="72" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="76" y="66" width="128" height="128" rx="30" fill="#0b1220" stroke="#1f2937"/>
  <path class="beat" d="M92 132 H120 L130 112 L142 156 L156 98 L166 132 H190" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="250" y="78" class="tag">FEATURED PROJECT</text>
  <text x="250" y="124" class="title">Pulsify — AI fitness &amp; nutrition</text>
  <text x="250" y="160" class="txt">Snap a meal → instant calories &amp; macros. Workouts, weekly plans, shopping lists. EN / BG.</text>
  <text x="250" y="184" class="txt">Designed, built, shipped and marketed solo — live on Google Play.</text>

  <g transform="translate(250 204)">
    <rect width="84" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.35"/><text x="42" y="19" text-anchor="middle" class="chip">FastAPI</text>
    <rect x="94" width="104" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.35"/><text x="146" y="19" text-anchor="middle" class="chip">PostgreSQL</text>
    <rect x="208" width="104" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.35"/><text x="260" y="19" text-anchor="middle" class="chip">Claude API</text>
    <rect x="322" width="100" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.35"/><text x="372" y="19" text-anchor="middle" class="chip">Capacitor</text>
    <rect x="432" width="112" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.35"/><text x="488" y="19" text-anchor="middle" class="chip">Play Billing</text>
  </g>
</svg>
