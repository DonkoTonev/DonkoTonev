<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0a2a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .name   { font: 800 64px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
    .hi     { font: 600 22px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .role   { font: 600 26px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: url(#accent); opacity: 0; }
    .mono   { font: 500 15px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #64748b; }
    .chip   { font: 600 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .r1 { animation: cycle 12s infinite 0s; }
    .r2 { animation: cycle 12s infinite 3s; }
    .r3 { animation: cycle 12s infinite 6s; }
    .r4 { animation: cycle 12s infinite 9s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(10px); }
      3%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 900; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -900; } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- heartbeat / data line -->
    <path class="pulse" d="M680 230 H780 L798 200 L816 270 L838 172 L860 255 L878 228 H1010 L1024 214 L1038 242 H1170"
          fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- terminal card -->
    <g class="float">
      <rect x="760" y="44" width="380" height="96" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155"/>
      <circle cx="782" cy="64" r="5" fill="#f87171"/><circle cx="798" cy="64" r="5" fill="#fbbf24"/><circle cx="814" cy="64" r="5" fill="#34d399"/>
      <text x="780" y="96" class="mono"><tspan fill="#2dd4bf">$</tspan> scrapy crawl the-web <tspan fill="#a78bfa">--at-scale</tspan></text>
      <text x="780" y="122" class="mono"><tspan fill="#2dd4bf">$</tspan> claude --agents <tspan fill="#a78bfa">ship-it</tspan><tspan class="cursor" fill="#e2e8f0">▍</tspan></text>
    </g>
  </g>

  <text x="64" y="92" class="hi">Hi there, I'm</text>
  <text x="62" y="160" class="name">Donko Tonev</text>

  <g transform="translate(64 210)">
    <text class="role r1">Software Engineer @ EDITED</text>
    <text class="role r2">Web Scraping &amp; Data Ingestion</text>
    <text class="role r3">Building Agentic AI Systems</text>
    <text class="role r4">Shipped Pulsify to Google Play</text>
  </g>

  <g transform="translate(64 252)">
    <rect width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="52" y="20" text-anchor="middle" class="chip">🐍 Python</text>
    <rect x="114" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="166" y="20" text-anchor="middle" class="chip">🕷️ Scrapy</text>
    <rect x="228" width="116" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="286" y="20" text-anchor="middle" class="chip">⚡ FastAPI</text>
    <rect x="354" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="414" y="20" text-anchor="middle" class="chip">🤖 AI Agents</text>
    <rect x="484" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="532" y="20" text-anchor="middle" class="chip">📍 Bulgaria</text>
  </g>
</svg>
